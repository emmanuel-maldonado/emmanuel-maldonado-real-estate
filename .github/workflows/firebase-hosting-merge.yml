name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile && pnpm exec next build --webpack
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{
            secrets.FIREBASE_SERVICE_ACCOUNT_EMMANUEL_MALDONADO_REAL_ESTATE }}
          channelId: live
          projectId: emmanuel-maldonado-real-estate
